<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeType — 코딩 타자 게임</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #161921;
    --bg3: #1e2230;
    --border: #2a2f3d;
    --accent: #4ade80;
    --accent2: #60a5fa;
    --accent3: #f472b6;
    --text: #e2e8f0;
    --muted: #64748b;
    --warn: #fb923c;
    --gold: #fbbf24;
    --silver: #94a3b8;
    --bronze: #b45309;
    --correct: #4ade80;
    --wrong: #f87171;
    --cursor: #4ade80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* GRID BG */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .screen { display: none; position: relative; z-index: 1; }
  .screen.active { display: flex; }

  /* ── LOBBY ── */
  #screen-lobby {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    gap: 2rem;
  }
  .logo {
    text-align: center;
  }
  .logo-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 700;
    letter-spacing: -2px;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(74,222,128,0.4);
  }
  .logo-sub {
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .lobby-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  .lobby-card h2 {
    font-size: 1rem;
    font-weight: 500;
    color: var(--muted);
    text-align: center;
    letter-spacing: 1px;
  }
  input[type="text"], input[type="number"], select {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    padding: 0.75rem 1rem;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, input[type="number"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(74,222,128,0.1);
  }
  .btn {
    background: var(--accent);
    color: #0d0f14;
    border: none;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 0.85rem 1.5rem;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
    letter-spacing: 1px;
  }
  .btn:hover { background: #86efac; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }
  .divider {
    display: flex; align-items: center; gap: 0.75rem;
    color: var(--muted); font-size: 0.8rem;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .room-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 180px; overflow-y: auto; }
  .room-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.75rem 1rem; cursor: pointer;
    transition: border-color 0.2s;
  }
  .room-item:hover { border-color: var(--accent2); }
  .room-name { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
  .room-count { font-size: 0.75rem; color: var(--muted); }
  .badge {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 20px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
  }
  .badge-waiting { background: rgba(96,165,250,0.15); color: var(--accent2); border: 1px solid rgba(96,165,250,0.3); }
  .badge-playing { background: rgba(251,146,60,0.15); color: var(--warn); border: 1px solid rgba(251,146,60,0.3); }

  /* ── WAITING ROOM ── */
  #screen-waiting {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    gap: 1.5rem;
  }
  .waiting-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 500px;
  }
  .waiting-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .waiting-title { font-size: 1.1rem; font-weight: 700; }
  .player-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
  .player-item {
    display: flex; align-items: center; gap: 0.75rem;
    background: var(--bg3); border-radius: 8px; padding: 0.65rem 1rem;
    font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;
  }
  .player-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; flex-shrink: 0;
  }
  .crown { color: var(--gold); margin-left: auto; font-size: 1rem; }
  .pulse { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.5; }
  }
  .waiting-hint { text-align: center; color: var(--muted); font-size: 0.85rem; }

  /* ── GAME ── */
  #screen-game {
    flex-direction: column;
    min-height: 100vh;
    padding: 1rem;
    gap: 1rem;
  }

  /* 상단 순위 바 */
  .rank-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem 1.25rem;
  }
  .rank-bar-title {
    font-size: 0.7rem; color: var(--muted);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .rank-entries { display: flex; flex-direction: column; gap: 0.4rem; }
  .rank-entry {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.4rem 0.5rem;
    border-radius: 6px;
    transition: background 0.2s;
  }
  .rank-entry.is-me { background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2); }
  .rank-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem; font-weight: 700;
    text-align: center;
  }
  .rank-1 { color: var(--gold); }
  .rank-2 { color: var(--silver); }
  .rank-3 { color: #cd7f32; }
  .rank-4, .rank-5 { color: var(--muted); }
  .rank-name {
    font-size: 0.85rem; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rank-progress-wrap {
    width: 120px; height: 6px;
    background: var(--bg3); border-radius: 3px; overflow: hidden;
  }
  .rank-progress-bar {
    height: 100%; border-radius: 3px;
    background: var(--accent);
    transition: width 0.4s ease;
  }
  .rank-wpm {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem; color: var(--muted);
    width: 52px; text-align: right;
  }

  /* 게임 영역 */
  .game-main {
    display: flex; flex: 1; gap: 1rem;
  }

  /* 타이핑 패널 */
  .typing-panel {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .typing-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .typing-q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem; color: var(--muted);
  }
  .typing-stats {
    display: flex; gap: 1rem;
  }
  .stat-item {
    text-align: center;
  }
  .stat-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem; font-weight: 700; color: var(--accent);
  }
  .stat-label {
    font-size: 0.65rem; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .typing-display {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    line-height: 1.9;
    min-height: 80px;
    position: relative;
    word-break: break-all;
    white-space: pre-wrap;
    letter-spacing: 0.5px;
  }
  .char { position: relative; }
  .char.correct { color: var(--correct); }
  .char.wrong { color: var(--wrong); background: rgba(248,113,113,0.15); border-radius: 2px; }
  .char.pending { color: var(--muted); }
  .char.cursor::after {
    content: '';
    position: absolute;
    left: 0; top: 2px; bottom: 2px;
    width: 2px;
    background: var(--cursor);
    animation: blink 1s step-end infinite;
    border-radius: 1px;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  .typing-input-wrap {
    position: relative;
  }
  .typing-input {
    width: 100%; padding: 0.85rem 1rem;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 0.95rem;
    outline: none; transition: border-color 0.2s;
    caret-color: var(--accent);
  }
  .typing-input:focus { border-color: var(--accent); }
  .typing-input.error { border-color: var(--wrong); box-shadow: 0 0 0 3px rgba(248,113,113,0.1); }
  .typing-input:disabled { opacity: 0.4; cursor: not-allowed; }
  .progress-outer {
    height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden;
  }
  .progress-inner {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px; transition: width 0.4s ease;
  }

  /* 사이드 패널 — 내 순위 */
  .side-panel {
    width: 200px;
    display: flex; flex-direction: column; gap: 1rem;
    flex-shrink: 0;
  }
  .my-rank-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.25rem;
    text-align: center;
  }
  .my-rank-label { font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem; }
  .my-rank-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 3rem; font-weight: 700; line-height: 1;
    color: var(--accent);
  }
  .my-rank-total { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

  .timer-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.25rem;
    text-align: center;
  }
  .timer-label { font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem; }
  .timer-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem; font-weight: 700;
    color: var(--text);
  }
  .timer-val.warn { color: var(--warn); animation: pulse 0.5s ease-in-out infinite; }

  /* ── RESULT ── */
  #screen-result {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    gap: 1.5rem;
  }
  .result-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 700;
    text-align: center;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(74,222,128,0.3);
  }
  .result-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 16px; padding: 2rem;
    width: 100%; max-width: 500px;
  }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; height: 100px; }
  .podium-item { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; flex: 1; }
  .podium-block {
    width: 100%; border-radius: 6px 6px 0 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
  }
  .podium-1 { height: 100px; background: linear-gradient(180deg, rgba(251,191,36,0.3), rgba(251,191,36,0.1)); border: 1px solid rgba(251,191,36,0.4); }
  .podium-2 { height: 75px; background: linear-gradient(180deg, rgba(148,163,184,0.3), rgba(148,163,184,0.1)); border: 1px solid rgba(148,163,184,0.4); }
  .podium-3 { height: 55px; background: linear-gradient(180deg, rgba(180,83,9,0.3), rgba(180,83,9,0.1)); border: 1px solid rgba(180,83,9,0.4); }
  .podium-name { font-size: 0.75rem; font-weight: 500; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90px; }
  .podium-wpm { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); }

  .result-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .result-row {
    display: grid; grid-template-columns: 32px 1fr auto auto;
    align-items: center; gap: 0.75rem;
    padding: 0.65rem 0.75rem;
    background: var(--bg3); border-radius: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
  }
  .result-row.is-me { background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2); }
  .result-rank { font-weight: 700; text-align: center; }
  .result-score { color: var(--accent2); }
  .result-wpm { color: var(--muted); font-size: 0.75rem; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.75rem 1.5rem;
    font-size: 0.85rem; color: var(--text);
    z-index: 100; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* COUNTDOWN OVERLAY */
  .countdown-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(13,15,20,0.85);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .countdown-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8rem; font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 60px rgba(74,222,128,0.6);
    animation: countPop 1s ease-out;
  }
  @keyframes countPop {
    0% { transform: scale(1.5); opacity: 0; }
    30% { transform: scale(1); opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  .avatar-colors {
    /* 플레이어별 색상 */
  }

  @media (max-width: 600px) {
    .game-main { flex-direction: column; }
    .side-panel { width: 100%; flex-direction: row; }
    .my-rank-card, .timer-card { flex: 1; }
    .rank-progress-wrap { display: none; }
  }
</style>
</head>
<body>

<!-- LOBBY -->
<div id="screen-lobby" class="screen active">
  <div class="logo">
    <div class="logo-title">&gt; CodeType_</div>
    <div class="logo-sub">코딩 타자 배틀</div>
  </div>
  <div class="lobby-card">
    <h2>닉네임 입력</h2>
    <input type="text" id="nickname-input" placeholder="예) dev_고양이" maxlength="12" autocomplete="off">
    <div class="divider">방 만들기</div>
    <input type="text" id="room-name-input" placeholder="방 이름 (예: 1반 배틀)" maxlength="20" autocomplete="off">
    <button class="btn" onclick="createRoom()">🚀 방 만들기</button>
    <div class="divider">또는 참가</div>
    <div class="room-list" id="room-list">
      <div style="text-align:center;color:var(--muted);font-size:0.85rem;padding:1rem;">방 목록 로딩 중...</div>
    </div>
  </div>
</div>

<!-- WAITING ROOM -->
<div id="screen-waiting" class="screen">
  <div class="waiting-card">
    <div class="waiting-header">
      <div class="waiting-title mono" id="waiting-room-name">방 이름</div>
      <div class="badge badge-waiting pulse">대기 중</div>
    </div>
    <div class="player-list" id="waiting-player-list"></div>
    <div class="waiting-hint" id="waiting-hint">방장이 게임을 시작할 때까지 대기해주세요</div>
    <div style="height:0.75rem"></div>
    <button class="btn" id="start-btn" style="display:none" onclick="startGame()">▶ 게임 시작</button>
    <button class="btn btn-ghost" onclick="leaveRoom()" style="margin-top:0.5rem">← 나가기</button>
  </div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <!-- 상단 순위 바 -->
  <div class="rank-bar">
    <div class="rank-bar-title">실시간 순위</div>
    <div class="rank-entries" id="rank-entries"></div>
  </div>

  <!-- 메인 게임 -->
  <div class="game-main">
    <div class="typing-panel">
      <div class="typing-header">
        <div class="typing-q-num mono" id="q-num">1 / 20</div>
        <div class="typing-stats">
          <div class="stat-item">
            <div class="stat-val" id="stat-wpm">0</div>
            <div class="stat-label">WPM</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" id="stat-acc">100%</div>
            <div class="stat-label">정확도</div>
          </div>
          <div class="stat-item">
            <div class="stat-val" id="stat-score">0</div>
            <div class="stat-label">점수</div>
          </div>
        </div>
      </div>
      <div class="progress-outer">
        <div class="progress-inner" id="my-progress" style="width:0%"></div>
      </div>
      <div class="typing-display mono" id="typing-display"></div>
      <div class="typing-input-wrap">
        <input type="text" class="typing-input mono" id="typing-input"
          placeholder="여기에 타이핑하세요..." autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false">
      </div>
    </div>

    <div class="side-panel">
      <div class="my-rank-card">
        <div class="my-rank-label">내 순위</div>
        <div class="my-rank-num" id="my-rank-num">-</div>
        <div class="my-rank-total" id="my-rank-total">/ - 명</div>
      </div>
      <div class="timer-card">
        <div class="timer-label">남은 시간</div>
        <div class="timer-val mono" id="timer-val">03:00</div>
      </div>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="result-title">🏁 게임 종료!</div>
  <div class="result-card">
    <div class="podium" id="podium"></div>
    <div class="result-list" id="result-list"></div>
  </div>
  <button class="btn" style="max-width:300px" onclick="backToLobby()">🏠 로비로 돌아가기</button>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://gjawpkcondtvztoumjqd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5RaHh16WSlAfM0qScGUr9Q_fg34LWW2';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── 타자 문제 풀 ──
const QUESTIONS = [
  // 터미널 명령어
  "git init",
  "git add .",
  "git commit -m 'first commit'",
  "git push origin main",
  "git clone https://github.com/user/repo.git",
  "git status",
  "git log --oneline",
  "git branch feature/login",
  "git checkout -b develop",
  "git merge feature/login",
  "ls -la",
  "cd ~/Documents",
  "mkdir my_project && cd my_project",
  "rm -rf node_modules",
  "chmod +x script.sh",
  "pip install -r requirements.txt",
  "python -m venv venv",

const AVATAR_COLORS = [
  ['#4ade80','#0d0f14'], ['#60a5fa','#0d0f14'], ['#f472b6','#0d0f14'],
  ['#fb923c','#0d0f14'], ['#a78bfa','#0d0f14'], ['#34d399','#0d0f14'],
  ['#fbbf24','#0d0f14'], ['#f87171','#0d0f14'],
];

// ── 상태 ──
let state = {
  nickname: '',
  playerId: null,
  sessionId: null,
  isHost: false,
  questions: [],
  currentQ: 0,
  score: 0,
  wpm: 0,
  accuracy: 100,
  totalChars: 0,
  wrongChars: 0,
  startTime: null,
  gameTimer: null,
  timeLeft: 180,
  realtimeChannel: null,
  allPlayers: [],
  finished: false,
  gameStarted: false,
  waitingPoller: null,
};

// ── 유틸 ──
function showToast(msg, duration=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function genSessionId() {
  return Math.random().toString(36).substr(2, 8).toUpperCase();
}

function shuffleQuestions() {
  const q = [...QUESTIONS];
  for (let i = q.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [q[i], q[j]] = [q[j], q[i]];
  }
  return q.slice(0, 20);
}

function getAvatarColor(index) {
  return AVATAR_COLORS[index % AVATAR_COLORS.length];
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2,'0');
  const s = (sec % 60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

// ── 방 목록 ──
async function loadRooms() {
  const { data } = await db.from('game_sessions')
    .select('*')
    .in('status', ['waiting','playing'])
    .order('created_at', { ascending: false });

  const list = document.getElementById('room-list');
  if (!data || data.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:0.85rem;padding:1rem;">열린 방이 없습니다</div>';
    return;
  }
  list.innerHTML = '';
  for (const room of data) {
    const { count } = await db.from('players').select('*', { count: 'exact', head: true }).eq('session_id', room.id);
    const div = document.createElement('div');
    div.className = 'room-item';
    div.innerHTML = `
      <div>
        <div class="room-name">${room.id}</div>
        <div class="room-count">${count || 0}명 참가 중</div>
      </div>
      <span class="badge ${room.status === 'waiting' ? 'badge-waiting' : 'badge-playing'}">
        ${room.status === 'waiting' ? '대기' : '진행중'}
      </span>
    `;
    if (room.status === 'waiting') {
      div.onclick = () => joinRoom(room.id);
    } else {
      div.style.opacity = '0.5';
      div.style.cursor = 'not-allowed';
    }
    list.appendChild(div);
  }
}

// 3초마다 방 목록 갱신
setInterval(loadRooms, 3000);
loadRooms();

// ── 방 만들기 ──
async function createRoom() {
  const nickname = document.getElementById('nickname-input').value.trim();
  const roomName = document.getElementById('room-name-input').value.trim();
  if (!nickname) { showToast('닉네임을 입력해주세요!'); return; }
  if (!roomName) { showToast('방 이름을 입력해주세요!'); return; }

  state.nickname = nickname;
  state.sessionId = roomName;
  state.isHost = true;
  state.questions = shuffleQuestions();

  await db.from('game_sessions').insert({
    id: roomName,
    status: 'waiting',
  });

  await enterWaitingRoom();
}

// ── 방 참가 ──
async function joinRoom(sessionId) {
  const nickname = document.getElementById('nickname-input').value.trim();
  if (!nickname) { showToast('먼저 닉네임을 입력해주세요!'); return; }

  const { data: session } = await db.from('game_sessions').select().eq('id', sessionId).single();
  if (!session) { showToast('방을 찾을 수 없어요'); return; }
  if (session.status !== 'waiting') { showToast('이미 진행 중인 방이에요'); return; }

  state.nickname = nickname;
  state.sessionId = sessionId;
  state.isHost = false;

  await enterWaitingRoom();
}

// ── 대기실 입장 ──
async function enterWaitingRoom() {
  const { data: player } = await db.from('players').insert({
    session_id: state.sessionId,
    nickname: state.nickname,
    progress: 0, wpm: 0, score: 0,
  }).select().single();

  state.playerId = player.id;

  document.getElementById('waiting-room-name').textContent = state.sessionId;
  if (state.isHost) {
    document.getElementById('start-btn').style.display = 'block';
    document.getElementById('waiting-hint').textContent = '준비되면 게임 시작 버튼을 눌러주세요';
  }

  showScreen('waiting');
  subscribeWaiting();
  updateWaitingList();
}

async function updateWaitingList() {
  const { data } = await db.from('players').select().eq('session_id', state.sessionId);
  state.allPlayers = data || [];
  const list = document.getElementById('waiting-player-list');
  list.innerHTML = '';
  (data || []).forEach((p, i) => {
    const [bg, fg] = getAvatarColor(i);
    const div = document.createElement('div');
    div.className = 'player-item';
    const isMe = p.id === state.playerId;
    div.innerHTML = `
      <div class="player-avatar" style="background:${bg};color:${fg}">${p.nickname.charAt(0).toUpperCase()}</div>
      <span>${p.nickname}${isMe ? ' <span style="color:var(--accent);font-size:0.75rem">(나)</span>' : ''}</span>
      ${i === 0 ? '<span class="crown">👑</span>' : ''}
    `;
    list.appendChild(div);
  });
}

function subscribeWaiting() {
  if (state.realtimeChannel) db.removeChannel(state.realtimeChannel);

  state.realtimeChannel = db.channel('room-' + state.sessionId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `session_id=eq.${state.sessionId}` },
      () => updateWaitingList()
    )
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_sessions' },
      (payload) => {
        if (payload.new.id === state.sessionId && payload.new.status === 'playing') {
          startGameClient(payload.new);
        }
      }
    )
    .subscribe();

  // 폴링 백업: 1.5초마다 세션 상태 직접 확인 (Realtime 못 잡을 때 대비)
  state.waitingPoller = setInterval(async () => {
    const { data } = await db.from('game_sessions').select('status, questions').eq('id', state.sessionId).single();
    if (data && data.status === 'playing' && !state.gameStarted) {
      startGameClient(data);
    }
  }, 1500);
}

// ── 방 나가기 ──
async function leaveRoom() {
  if (state.playerId) {
    await db.from('players').delete().eq('id', state.playerId);
  }
  if (state.isHost) {
    await db.from('game_sessions').delete().eq('id', state.sessionId);
  }
  if (state.realtimeChannel) db.removeChannel(state.realtimeChannel);
  resetState();
  showScreen('lobby');
}

// ── 게임 시작 (방장) ──
async function startGame() {
  const { data: players } = await db.from('players').select().eq('session_id', state.sessionId);
  if (!players || players.length < 1) { showToast('최소 1명 이상 필요해요'); return; }

  state.questions = shuffleQuestions();

  const { data } = await db.from('game_sessions').update({
    status: 'playing',
    started_at: new Date().toISOString(),
    questions: state.questions,
  }).eq('id', state.sessionId).select().single();

  // 방장은 Realtime을 못 받을 수 있으므로 직접 시작
  startGameClient(data || { id: state.sessionId, status: 'playing', questions: state.questions });
}

// ── 게임 시작 (클라이언트) ──
async function startGameClient(sessionData) {
  if (state.gameStarted) return;
  state.gameStarted = true;
  clearInterval(state.waitingPoller);

  // 문제 목록을 sessionData에서 받거나, 없으면 DB에서 직접 조회
  if (sessionData && sessionData.questions && sessionData.questions.length > 0) {
    state.questions = sessionData.questions;
  } else {
    const { data } = await db.from('game_sessions').select('questions').eq('id', state.sessionId).single();
    if (data && data.questions && data.questions.length > 0) {
      state.questions = data.questions;
    } else {
      state.questions = shuffleQuestions(); // 최후의 폴백
    }
  }

  showCountdown(() => {
    state.currentQ = 0;
    state.score = 0;
    state.wpm = 0;
    state.accuracy = 100;
    state.totalChars = 0;
    state.wrongChars = 0;
    state.finished = false;
    state.timeLeft = 180;
    state.startTime = Date.now();

    showScreen('game');
    subscribeGame();
    renderQuestion();
    startTimer();
    startLiveSync();

    document.getElementById('typing-input').focus();
  });
}

function showCountdown(cb) {
  const overlay = document.createElement('div');
  overlay.className = 'countdown-overlay';
  document.body.appendChild(overlay);

  let count = 3;
  function tick() {
    overlay.innerHTML = `<div class="countdown-num">${count}</div>`;
    if (count === 0) {
      overlay.innerHTML = `<div class="countdown-num" style="color:var(--accent2)">GO!</div>`;
      setTimeout(() => { overlay.remove(); cb(); }, 800);
      return;
    }
    count--;
    setTimeout(tick, 1000);
  }
  tick();
}

// ── 게임 실시간 구독 ──
function subscribeGame() {
  if (state.realtimeChannel) db.removeChannel(state.realtimeChannel);

  state.realtimeChannel = db.channel('game-' + state.sessionId)
    .on('postgres_changes', {
      event: 'UPDATE', schema: 'public', table: 'players',
      filter: `session_id=eq.${state.sessionId}`
    }, () => updateRankBar())
    .on('postgres_changes', {
      event: 'UPDATE', schema: 'public', table: 'game_sessions',
      filter: `id=eq.${state.sessionId}`
    }, (payload) => {
      if (payload.new.status === 'finished') showResult();
    })
    .subscribe();
}

// ── 문제 렌더 ──
function renderQuestion() {
  if (state.currentQ >= state.questions.length) {
    finishGame();
    return;
  }
  const q = state.questions[state.currentQ];
  const display = document.getElementById('typing-display');
  display.innerHTML = '';

  for (let i = 0; i < q.length; i++) {
    const span = document.createElement('span');
    span.className = 'char pending' + (i === 0 ? ' cursor' : '');
    span.dataset.index = i;
    span.textContent = q[i];
    display.appendChild(span);
  }

  document.getElementById('typing-input').value = '';
  document.getElementById('typing-input').disabled = false;
  document.getElementById('q-num').textContent = `${state.currentQ + 1} / ${state.questions.length}`;

  const pct = (state.currentQ / state.questions.length) * 100;
  document.getElementById('my-progress').style.width = pct + '%';
}

// ── 타이핑 입력 처리 ──
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('typing-input');
  input.addEventListener('input', handleInput);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const q = state.questions[state.currentQ];
      if (input.value === q) submitAnswer();
    }
  });
});

function handleInput(e) {
  if (state.finished) return;
  const q = state.questions[state.currentQ];
  const typed = e.target.value;
  const chars = document.querySelectorAll('#typing-display .char');

  let allCorrect = true;
  for (let i = 0; i < q.length; i++) {
    chars[i].classList.remove('correct', 'wrong', 'pending', 'cursor');
    if (i < typed.length) {
      if (typed[i] === q[i]) {
        chars[i].classList.add('correct');
      } else {
        chars[i].classList.add('wrong');
        allCorrect = false;
      }
    } else if (i === typed.length) {
      chars[i].classList.add('pending', 'cursor');
    } else {
      chars[i].classList.add('pending');
    }
  }

  const input = e.target;
  if (typed.length > 0 && !allCorrect) {
    input.classList.add('error');
  } else {
    input.classList.remove('error');
  }

  // 자동 제출 (전체 입력 완료 + 일치)
  if (typed.length === q.length && allCorrect) {
    submitAnswer();
  }

  updateStats(typed);
}

function submitAnswer() {
  const q = state.questions[state.currentQ];
  const elapsed = (Date.now() - state.startTime) / 1000 / 60;
  const wordsTyped = (state.currentQ + 1) * (q.length / 5);
  state.wpm = Math.round(wordsTyped / Math.max(elapsed, 0.01));
  state.score += Math.max(100 - state.wrongChars * 5, 10);
  state.currentQ++;

  // DB 업데이트
  db.from('players').update({
    progress: state.currentQ,
    wpm: state.wpm,
    score: state.score,
  }).eq('id', state.playerId);

  if (state.currentQ >= state.questions.length) {
    finishGame();
  } else {
    renderQuestion();
  }
}

function updateStats(typed) {
  const elapsed = (Date.now() - state.startTime) / 1000 / 60;
  const totalTyped = state.currentQ * 5 + typed.length;
  const wpm = Math.round((totalTyped / 5) / Math.max(elapsed, 0.001));
  state.wpm = wpm;
  document.getElementById('stat-wpm').textContent = wpm;
  document.getElementById('stat-score').textContent = state.score;
}

// 1초마다 현재 진행상황 DB에 푸시 (상대방 순위바에 반영)
function startLiveSync() {
  clearInterval(state.syncTimer);
  state.syncTimer = setInterval(async () => {
    if (!state.playerId || state.finished) return;
    const elapsed = (Date.now() - state.startTime) / 1000 / 60;
    const totalTyped = state.currentQ * 5;
    const wpm = Math.round((totalTyped / 5) / Math.max(elapsed, 0.001));
    state.wpm = wpm;
    document.getElementById('stat-wpm').textContent = wpm;
    await db.from('players').update({
      progress: state.currentQ,
      wpm: wpm,
      score: state.score,
    }).eq('id', state.playerId);
  }, 1000);
}

// ── 타이머 ──
function startTimer() {
  clearInterval(state.gameTimer);
  state.timeLeft = 180;

  state.gameTimer = setInterval(async () => {
    state.timeLeft--;
    const el = document.getElementById('timer-val');
    el.textContent = formatTime(state.timeLeft);
    if (state.timeLeft <= 30) el.classList.add('warn');

    if (state.timeLeft <= 0) {
      clearInterval(state.gameTimer);
      await finishGame();
    }
  }, 1000);
}

// ── 순위 바 업데이트 ──
async function updateRankBar() {
  const { data } = await db.from('players').select()
    .eq('session_id', state.sessionId)
    .order('score', { ascending: false });

  if (!data) return;
  state.allPlayers = data;

  const total = data.length;
  const myRank = data.findIndex(p => p.id === state.playerId) + 1;
  document.getElementById('my-rank-num').textContent = myRank || '-';
  document.getElementById('my-rank-total').textContent = `/ ${total}명`;

  const entries = document.getElementById('rank-entries');
  entries.innerHTML = '';
  const show = data.slice(0, 5);
  const maxProgress = state.questions.length || 20;
  show.forEach((p, i) => {
    const isMe = p.id === state.playerId;
    const pct = Math.min(Math.round((p.progress / maxProgress) * 100), 100);
    const rankColors = ['rank-1','rank-2','rank-3','rank-4','rank-5'];
    const rankEmoji = ['🥇','🥈','🥉','4','5'];
    const div = document.createElement('div');
    div.className = `rank-entry${isMe ? ' is-me' : ''}`;
    div.innerHTML = `
      <div class="rank-num ${rankColors[i]}">${rankEmoji[i]}</div>
      <div class="rank-name">${p.nickname}${isMe ? ' ◀' : ''}</div>
      <div class="rank-progress-wrap"><div class="rank-progress-bar" style="width:${pct}%"></div></div>
      <div class="rank-wpm">${p.wpm} wpm</div>
    `;
    entries.appendChild(div);
  });
}

// ── 게임 종료 ──
async function finishGame() {
  if (state.finished) return;
  state.finished = true;
  clearInterval(state.gameTimer);
  document.getElementById('typing-input').disabled = true;

  await db.from('players').update({
    progress: state.currentQ,
    wpm: state.wpm,
    score: state.score,
    finished_at: new Date().toISOString(),
  }).eq('id', state.playerId);

  // 방장이면 세션 종료 처리
  if (state.isHost) {
    setTimeout(async () => {
      await db.from('game_sessions').update({
        status: 'finished',
        finished_at: new Date().toISOString(),
      }).eq('id', state.sessionId);
    }, 3000);
  }

  showToast('타이핑 완료! 🎉 결과를 기다리는 중...');
  setTimeout(() => showResult(), 3500);
}

// ── 결과 화면 ──
async function showResult() {
  clearInterval(state.gameTimer);
  if (state.realtimeChannel) db.removeChannel(state.realtimeChannel);

  const { data } = await db.from('players').select()
    .eq('session_id', state.sessionId)
    .order('score', { ascending: false });

  if (!data) return;

  // 포디움
  const podium = document.getElementById('podium');
  podium.innerHTML = '';
  const podiumOrder = [1, 0, 2]; // 2위, 1위, 3위 순서로 표시
  const podiumClasses = ['podium-2', 'podium-1', 'podium-3'];
  const podiumEmoji = ['🥈', '🥇', '🥉'];

  podiumOrder.forEach((idx, pos) => {
    const p = data[idx];
    if (!p) return;
    const item = document.createElement('div');
    item.className = 'podium-item';
    item.innerHTML = `
      <div class="podium-name">${p.nickname}</div>
      <div class="podium-wpm">${p.wpm} wpm</div>
      <div class="podium-block ${podiumClasses[pos]}">${podiumEmoji[pos]}</div>
    `;
    podium.appendChild(item);
  });

  // 전체 목록
  const list = document.getElementById('result-list');
  list.innerHTML = '';
  const rankEmoji = ['🥇','🥈','🥉'];
  data.forEach((p, i) => {
    const isMe = p.id === state.playerId;
    const div = document.createElement('div');
    div.className = `result-row${isMe ? ' is-me' : ''}`;
    div.innerHTML = `
      <div class="result-rank ${i < 3 ? 'rank-' + (i+1) : ''}">${rankEmoji[i] || (i+1)}</div>
      <div>${p.nickname}${isMe ? ' <span style="color:var(--accent);font-size:0.75rem">(나)</span>' : ''}</div>
      <div class="result-score">${p.score}점</div>
      <div class="result-wpm">${p.wpm} wpm</div>
    `;
    list.appendChild(div);
  });

  showScreen('result');

  // 세션 데이터 정리 (5분 후)
  setTimeout(async () => {
    await db.from('players').delete().eq('session_id', state.sessionId);
    await db.from('game_sessions').delete().eq('id', state.sessionId);
  }, 300000);
}

// ── 로비로 ──
async function backToLobby() {
  resetState();
  showScreen('lobby');
  loadRooms();
}

function resetState() {
  clearInterval(state.gameTimer);
  clearInterval(state.waitingPoller);
  clearInterval(state.syncTimer);
  if (state.realtimeChannel) db.removeChannel(state.realtimeChannel);
  state = {
    nickname: '', playerId: null, sessionId: null, isHost: false,
    questions: [], currentQ: 0, score: 0, wpm: 0, accuracy: 100,
    totalChars: 0, wrongChars: 0, startTime: null,
    gameTimer: null, timeLeft: 180, realtimeChannel: null,
    allPlayers: [], finished: false, gameStarted: false,
    waitingPoller: null, syncTimer: null,
  };
}

// 주기적 순위 업데이트
setInterval(() => {
  if (document.getElementById('screen-game').classList.contains('active')) {
    updateRankBar();
  }
}, 2000);
</script>
